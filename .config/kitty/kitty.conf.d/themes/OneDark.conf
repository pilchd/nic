#: The basic colors

foreground                      #ABB2BF
background                      #1E2127
selection_foreground            #1E2127
selection_background            #ABB2BF


#: Cursor colors

cursor                          #ABB2BF
# cursor_text_color               #111111
# cursor_trail_color              none


#: URL underline color when hovering with mouse

url_color                       #ABB2BF


#: kitty window border colors and terminal bell colors

active_border_color             #ABB2BF
inactive_border_color           #5C6370
# bell_border_color               #ff5a00
# visual_bell_color               none


#: OS Window titlebar colors

# wayland_titlebar_color          system
# macos_titlebar_color            system


#: Tab bar colors

active_tab_foreground           #FFFFFF
active_tab_background           #1E2127
inactive_tab_foreground         #ABB2BF
inactive_tab_background         #1E2127
# tab_bar_background              none
# tab_bar_margin_color            none


#: Colors for marks (marked text in the terminal)

mark1_foreground black
mark1_background #E06C75
mark2_foreground black
mark2_background #98C379
mark3_foreground black
mark3_background #D19A66


