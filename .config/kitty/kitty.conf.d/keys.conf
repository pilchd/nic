## Mappable actions
## https://sw.kovidgoyal.net/kitty/actions/


## Copy/paste
## https://sw.kovidgoyal.net/kitty/actions/#copy-paste

map                             ESCAPE                          combine ; clear_selection ; send_key ESCAPE
map --when-focus-on var:editor  ESCAPE

map                             ctrl+c                          copy_and_clear_or_interrupt
map                             kitty_mod+c                     combine ; copy_to_clipboard ; clear_selection

map                             kitty_mod+v                     paste_from_clipboard

map                             kitty_mod+r                     show_scrollback
map                             kitty_mod+SPACE                 show_last_non_empty_command_output
map                             kitty_mod+alt+SPACE             show_last_visited_command_output


## Debugging
## https://sw.kovidgoyal.net/kitty/actions/#debugging

map                             kitty_mod+ESCAPE>ESCAPE         debug_config
map                             kitty_mod+ESCAPE>e              show_kitty_env_vars
map                             kitty_mod+ESCAPE>BACKSPACE      close_shared_ssh_connections


## Layouts
## https://sw.kovidgoyal.net/kitty/actions/#layouts

map --new-mode lm               kitty_mod+.
map --mode lm                   ESCAPE                          pop_keyboard_mode

map --mode lm                   kitty_mod+.                     combine ; toggle_layout stack ; pop_keyboard_mode

map --mode lm                   z                               combine ; goto_layout stack ;      pop_keyboard_mode
map --mode lm                   t                               combine ; goto_layout tall ;       pop_keyboard_mode
map --mode lm                   f                               combine ; goto_layout fat ;        pop_keyboard_mode
map --mode lm                   g                               combine ; goto_layout grid ;       pop_keyboard_mode
map --mode lm                   s                               combine ; goto_layout splits ;     pop_keyboard_mode
map --mode lm                   h                               combine ; goto_layout horizontal ; pop_keyboard_mode
map --mode lm                   v                               combine ; goto_layout vertical ;   pop_keyboard_mode

map --mode lm                   j                               next_layout
map --mode lm                   k                               next_layout -1


## Marks
## https://sw.kovidgoyal.net/kitty/actions/#marks

map --new-mode mark             kitty_mod+/
map --mode mark                 ESCAPE                          pop_keyboard_mode

map --mode mark                 kitty_mod+/                     combine ; pop_keyboard_mode ; create_marker

map --mode mark                 j                               scroll_to_mark next
map --mode mark                 k                               scroll_to_mark prev

map --mode mark --new-mode 1    1
map --mode 1                    ESCAPE                          combine ; pop_keyboard_mode ; pop_keyboard_mode

map --mode 1                    j                               scroll_to_mark next 1
map --mode 1                    k                               scroll_to_mark prev 1

map --mode mark --new-mode 2    2
map --mode 2                    ESCAPE                          combine ; pop_keyboard_mode ; pop_keyboard_mode

map --mode 2                    j                               scroll_to_mark next 2
map --mode 2                    k                               scroll_to_mark prev 2

map --mode mark --new-mode 3    3
map --mode 3                    ESCAPE                          combine ; pop_keyboard_mode ; pop_keyboard_mode

map --mode 3                    j                               scroll_to_mark next 3
map --mode 3                    k                               scroll_to_mark prev 3

map --mode mark                 /                               combine ; remove_marker ; pop_keyboard_mode


## Miscellaneous
## https://sw.kovidgoyal.net/kitty/actions/#miscellaneous

#map                             ctrl+l                          clear_terminal to_cursor_scroll active
map                             shift+ENTER                     clear_terminal last_command active
map --when-focus-on var:editor  shift+ENTER
map                             kitty_mod+g                     combine ; clear_terminal scrollback active ; clear_terminal to_cursor active
map                             kitty_mod+alt+g                 clear_terminal reset active

map                             kitty_mod+p                     command_palette

map                             kitty_mod+f>kitty_mod+f         kitten hints --type hyperlink

map                             kitty_mod+f>kitty_mod+o         kitten hints --type url
map                             kitty_mod+f>o                   kitten hints --type url --program @

map                             kitty_mod+f>kitty_mod+p         kitten hints --type path --multiple --program -
map                             kitty_mod+f>p                   kitten hints --type path --multiple --program @

map                             kitty_mod+f>kitty_mod+h         kitten hints --type hash --program -
map                             kitty_mod+f>h                   kitten hints --type hash --program @

map                             kitty_mod+f>kitty_mod+i         kitten hints --type ip --program @
map                             kitty_mod+f>i                   kitten hints --type ip --program -

map                             kitty_mod+f>kitty_mod+c         kitten hints --customize-processing kitty.conf.d/hints/call-sign.py --multiple

map                             kitty_mod+i                     kitten unicode_input

map                             kitty_mod+w                     launch --cwd=current --location=vsplit
map                             kitty_mod+q                     launch --cwd=current --location=hsplit

map                             kitty_mod+t                     launch --cwd=current --type=tab --location=after
map                             kitty_mod+b                     launch --cwd=current --type=tab --location=before

map                             kitty_mod+x                     launch --stdin-source=@last_cmd_output wl-copy

map                             kitty_mod+ESCAPE>kitty_mod+ESCAPE load_config_file
map                             kitty_mod+ESCAPE>SPACE          kitty_shell


## Scrolling
## https://sw.kovidgoyal.net/kitty/actions/#scrolling

map                             kitty_mod+DOWN                  scroll_line_down
map                             kitty_mod+UP                    scroll_line_up

map                             kitty_mod+PAGE_DOWN             scroll_page_down
map                             kitty_mod+PAGE_UP               scroll_page_up

map                             kitty_mod+HOME                  scroll_home
map                             kitty_mod+END                   scroll_end

map                             kitty_mod+LEFT                  scroll_to_prompt -1
map                             kitty_mod+RIGHT                 scroll_to_prompt  1


## Tab management
## https://sw.kovidgoyal.net/kitty/actions/#tab-management

map                             kitty_mod+h                     previous_tab
map                             kitty_mod+l                     next_tab

map                             kitty_mod+alt+h                 move_tab_backward
map                             kitty_mod+alt+l                 move_tab_forward

map                             kitty_mod+BACKSPACE             goto_tab 0
map                             kitty_mod+9                     goto_tab 1
map                             kitty_mod+8                     goto_tab 2
map                             kitty_mod+7                     goto_tab 3
map                             kitty_mod+6                     goto_tab 4
map                             kitty_mod+5                     goto_tab 5
map                             kitty_mod+4                     goto_tab 6
map                             kitty_mod+3                     goto_tab 7
map                             kitty_mod+2                     goto_tab 8
map                             kitty_mod+1                     goto_tab 9

map                             kitty_mod+u                     set_tab_title


## Window management
## https://sw.kovidgoyal.net/kitty/actions/#window-management


map                             kitty_mod+j                     neighboring_window left
map                             kitty_mod+alt+j                 neighboring_window down
map                             kitty_mod+alt+k                 neighboring_window up
map                             kitty_mod+k                     neighboring_window right

map                             kitty_mod+;                     focus_visible_window
map                             kitty_mod+alt+;                 swap_with_window

map --new-mode wm               kitty_mod+a
map --mode wm                   ESCAPE                          pop_keyboard_mode

map --mode wm                   h                               neighboring_window left
map --mode wm                   j                               neighboring_window down
map --mode wm                   k                               neighboring_window up
map --mode wm                   l                               neighboring_window right

map --mode wm                   shift+h                         resize_window narrower
map --mode wm                   shift+j                         resize_window shorter
map --mode wm                   shift+k                         resize_window taller
map --mode wm                   shift+l                         resize_window wider

map --mode wm                   ctrl+h                          move_window left
map --mode wm                   ctrl+j                          move_window down
map --mode wm                   ctrl+k                          move_window up
map --mode wm                   ctrl+l                          move_window right

map --mode wm                   kitty_mod+a                     combine ; pop_keyboard_mode ; start_resizing_window
map                             kitty_mod+alt+a                 resize_window reset

map                             kitty_mod+0                     change_font_size current 0
map                             kitty_mod+=                     change_font_size current +0.5
map                             kitty_mod+-                     change_font_size current -0.5

map                             kitty_mod+alt+0                 change_font_size all 0
map                             kitty_mod+alt+=                 change_font_size all +0.5
map                             kitty_mod+alt+-                 change_font_size all -0.5
